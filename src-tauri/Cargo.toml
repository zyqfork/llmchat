[package]
name = "llmchat"
version = "2.31.0"
description = "A cross platform app for LLM ChatBot."
authors = ["zyq"]
license = "mit"
repository = ""
default-run = "llmchat"
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11", features = ["tray-icon", "devtools"] }
tauri-plugin-shell = "2.3"
tauri-plugin-dialog = "2.3"
tauri-plugin-clipboard-manager = "2.3"
tauri-plugin-fs = "2.4"
tauri-plugin-notification = "2.3"
tauri-plugin-http = "2.5"
tauri-plugin-window-state = "2.4"
tauri-plugin-updater = "2.10"
tauri-plugin-process = "2.3"
tauri-plugin-single-instance = "2.4"
tauri-plugin-deep-link = "2.4"
tauri-plugin-global-shortcut = "2.3"
percent-encoding = "2.3.1"
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3.30"
bytes = "1.7.2"
once_cell = "1"
tokio = { version = "1", features = ["sync"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
http = "1"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

# 调试功能：启用开发者工具
debug-devtools = ["tauri/devtools"]
