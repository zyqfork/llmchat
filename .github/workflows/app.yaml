name: Release App

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to upload artifacts to (manual trigger only; empty means latest release)
        required: false
        default: ""
  release:
    types: [published]

concurrency:
  group: release-app-${{ github.event_name == 'push' && 'latest' || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.release_id }}
      release_tag: ${{ steps.create-release.outputs.release_tag }}
      is_latest_channel: ${{ steps.create-release.outputs.is_latest_channel }}
      build_ref: ${{ steps.create-release.outputs.build_ref }}

    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.ref }}

      - name: setup node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: create release
        id: create-release
        uses: actions/github-script@v6
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const eventName = context.eventName

            async function ensureLatestRelease() {
              const sha = context.sha
              const shortSha = sha.slice(0, 7)

              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: "tags/latest",
                })
              } catch (error) {
                if (error.status !== 404 && error.status !== 422) {
                  throw error
                }
              }

              await github.rest.git.createRef({
                owner,
                repo,
                ref: "refs/tags/latest",
                sha,
              })

              const body =
                `Automatic build from \`${context.ref}\` at [` +
                `\`${shortSha}\`](${context.serverUrl}/${owner}/${repo}/commit/${sha}).`

              let release
              try {
                const existing = await github.rest.repos.getReleaseByTag({
                  owner,
                  repo,
                  tag: "latest",
                })
                release = existing.data

                const assets = await github.paginate(
                  github.rest.repos.listReleaseAssets,
                  {
                    owner,
                    repo,
                    release_id: release.id,
                  },
                )
                for (const asset of assets) {
                  await github.rest.repos.deleteReleaseAsset({
                    owner,
                    repo,
                    asset_id: asset.id,
                  })
                }

                const updated = await github.rest.repos.updateRelease({
                  owner,
                  repo,
                  release_id: release.id,
                  tag_name: "latest",
                  target_commitish: sha,
                  name: "Latest",
                  body,
                  draft: false,
                  prerelease: false,
                })
                release = updated.data
              } catch (error) {
                if (error.status !== 404) {
                  throw error
                }
                const created = await github.rest.repos.createRelease({
                  owner,
                  repo,
                  tag_name: "latest",
                  target_commitish: sha,
                  name: "Latest",
                  body,
                  draft: false,
                  prerelease: false,
                })
                release = created.data
              }

              core.setOutput("is_latest_channel", "true")
              return release
            }

            let data

            if (eventName === "release") {
              data = context.payload.release
              core.setOutput("is_latest_channel", "false")
              core.setOutput("build_ref", data.tag_name)
            } else if (eventName === "push") {
              data = await ensureLatestRelease()
              core.setOutput("build_ref", context.sha)
            } else if (process.env.RELEASE_TAG) {
              const response = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag: process.env.RELEASE_TAG,
              })
              data = response.data
              core.setOutput("is_latest_channel", "false")
              core.setOutput("build_ref", data.tag_name)
            } else {
              const response = await github.rest.repos.getLatestRelease({
                owner,
                repo,
              })
              data = response.data
              core.setOutput(
                "is_latest_channel",
                data.tag_name === "latest" ? "true" : "false",
              )
              core.setOutput("build_ref", data.tag_name)
            }

            core.setOutput("release_id", String(data.id))
            core.setOutput("release_tag", data.tag_name)

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: ubuntu-22.04
            arch: amd64
            rust_target: x86_64-unknown-linux-gnu
            tauri_args: ""
          - os: ubuntu-24.04-arm
            arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            tauri_args: "--target aarch64-unknown-linux-gnu"
          - os: macos-latest
            arch: universal
            rust_target: x86_64-apple-darwin,aarch64-apple-darwin
            tauri_args: "--target universal-apple-darwin"
          - os: windows-latest
            arch: amd64
            rust_target: x86_64-pc-windows-msvc
            tauri_args: ""
          - os: windows-11-arm
            arch: arm64
            rust_target: aarch64-pc-windows-msvc
            tauri_args: "--target aarch64-pc-windows-msvc"

    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ needs.create-release.outputs.build_ref }}

      - name: setup node
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'yarn'

      - name: sync version from release tag
        shell: bash
        run: |
          if [ "${{ needs.create-release.outputs.is_latest_channel }}" = "true" ]; then
            PKG_VERSION="$(node -p "require('./package.json').version")"
            BUILD_META="$(( ${GITHUB_RUN_NUMBER:-1} % 65535 ))"
            if [ "$BUILD_META" -eq 0 ]; then BUILD_META=1; fi
            node scripts/sync-version-from-tag.mjs "v${PKG_VERSION}-latest+${BUILD_META}"
          else
            node scripts/sync-version-from-tag.mjs "${{ needs.create-release.outputs.release_tag }}"
          fi

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.config.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.config.os }}

      - name: install dependencies (ubuntu only)
        if: startsWith(matrix.config.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2


      - name: install frontend dependencies
        run: yarn install && yarn export

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
#          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
#          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
#          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
#          APPLE_ID: ${{ secrets.APPLE_ID }}
#          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
#          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.config.tauri_args }}

  build-electron:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: ubuntu-22.04
            artifact_name: electron-linux-amd64
            command: yarn electron:build --linux AppImage deb
            artifact_glob: |
              dist/*.AppImage
              dist/*.deb
          - os: ubuntu-24.04-arm
            artifact_name: electron-linux-arm64
            command: yarn electron:build --linux AppImage deb
            artifact_glob: |
              dist/*.AppImage
              dist/*.deb
          - os: windows-latest
            artifact_name: electron-windows
            command: yarn electron:build --win nsis
            artifact_glob: dist/*.exe
          - os: macos-latest
            artifact_name: electron-macos-universal
            command: yarn electron:build --mac dmg
            artifact_glob: dist/*.dmg

    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ needs.create-release.outputs.build_ref }}

      - name: setup node
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: "yarn"

      - name: sync version from release tag
        shell: bash
        run: |
          if [ "${{ needs.create-release.outputs.is_latest_channel }}" = "true" ]; then
            PKG_VERSION="$(node -p "require('./package.json').version")"
            BUILD_META="$(( ${GITHUB_RUN_NUMBER:-1} % 65535 ))"
            if [ "$BUILD_META" -eq 0 ]; then BUILD_META=1; fi
            node scripts/sync-version-from-tag.mjs "v${PKG_VERSION}-latest+${BUILD_META}"
          else
            node scripts/sync-version-from-tag.mjs "${{ needs.create-release.outputs.release_tag }}"
          fi

      - name: install Linux packaging dependencies (ubuntu only)
        if: startsWith(matrix.config.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: install frontend dependencies
        run: yarn install

      - name: build electron app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ${{ matrix.config.command }}

      - name: upload electron artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.artifact_name }}
          path: ${{ matrix.config.artifact_glob }}
          if-no-files-found: error

      - name: upload electron to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.release_tag }}
          files: ${{ matrix.config.artifact_glob }}

  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [create-release, build-tauri, build-electron]

    steps:
      - name: publish release
        id: publish-release
        uses: actions/github-script@v6
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          IS_LATEST_CHANNEL: ${{ needs.create-release.outputs.is_latest_channel }}
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.RELEASE_ID,
              name: process.env.IS_LATEST_CHANNEL === "true" ? "Latest" : undefined,
              draft: false,
              prerelease: false,
            })

      - name: normalize latest asset names
        if: needs.create-release.outputs.is_latest_channel == 'true'
        uses: actions/github-script@v6
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const releaseId = Number(process.env.RELEASE_ID)

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: releaseId,
            })

            function normalizeName(name) {
              // Keep updater metadata file names unchanged.
              if (name === "latest.json" || name.endsWith(".sig")) {
                return name
              }

              if (name.startsWith("LLMChat-electron-")) {
                return name.replace(
                  /^LLMChat-electron-.*?-latest-/,
                  "LLMChat-electron-latest-",
                )
              }

              if (name.startsWith("LLMChat-Tauri")) {
                let normalized = name
                if (name.includes("-latest") || name.includes("_latest")) {
                  normalized = name.replace(
                    /^LLMChat-Tauri[_-].*?-latest(?:\+[A-Za-z0-9]+)?([_-])/,
                    "LLMChat-Tauri-latest$1",
                  )
                } else {
                  normalized = name.replace(
                    /^LLMChat-Tauri[_-]/,
                    "LLMChat-Tauri-latest_",
                  )
                }
                // RPM 包默认包含 release 序号（如 -1.x86_64.rpm），latest 命名中去掉该序号。
                normalized = normalized.replace(
                  /-1\.(aarch64|x86_64)\.rpm$/,
                  ".$1.rpm",
                )
                return normalized
              }

              return name
            }

            for (const asset of assets) {
              const nextName = normalizeName(asset.name)
              if (nextName === asset.name) continue
              await github.rest.repos.updateReleaseAsset({
                owner,
                repo,
                asset_id: asset.id,
                name: nextName,
              })
            }
