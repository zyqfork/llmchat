name: Release App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build desktop apps (e.g. v2.19.0)
        required: true

concurrency:
  group: release-app-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.release_id }}
      release_tag: ${{ steps.create-release.outputs.release_tag }}
      build_ref: ${{ steps.create-release.outputs.build_ref }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: create release
        id: create-release
        uses: actions/github-script@v7
        env:
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const eventName = context.eventName

            function resolveTag() {
              if (eventName === "workflow_dispatch") {
                const tag = String(process.env.INPUT_TAG || "").trim()
                if (!tag) {
                  throw new Error("workflow_dispatch 需要指定 tag 参数")
                }
                return tag
              }
              if (eventName === "push" && context.ref.startsWith("refs/tags/")) {
                return context.ref.replace("refs/tags/", "")
              }
              throw new Error(`不支持的事件类型：${eventName}`)
            }

            async function resolveTagSha(tag) {
              if (eventName === "push" && context.ref.startsWith("refs/tags/")) {
                return context.sha
              }

              const ref = await github.rest.git.getRef({
                owner,
                repo,
                ref: `tags/${tag}`,
              })
              return ref.data.object.sha
            }

            async function ensureRelease(tag, sha) {
              try {
                const existing = await github.rest.repos.getReleaseByTag({
                  owner,
                  repo,
                  tag,
                })
                return existing.data
              } catch (error) {
                if (error.status !== 404) {
                  throw error
                }
              }

              const created = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: sha,
                name: tag,
                body:
                  `Desktop release for \`${tag}\` at [` +
                  `\`${sha.slice(0, 7)}\`](${context.serverUrl}/${owner}/${repo}/commit/${sha}).`,
                draft: true,
                prerelease: false,
              })
              return created.data
            }

            const tag = resolveTag()
            const sha = await resolveTagSha(tag)
            const data = await ensureRelease(tag, sha)

            core.setOutput("release_id", String(data.id))
            core.setOutput("release_tag", data.tag_name)
            core.setOutput("build_ref", data.tag_name)

  lint-test:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.build_ref }}

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"

      - name: install dependencies
        run: yarn install --frozen-lockfile

      - name: run lint
        run: yarn lint

      - name: run tests
        run: yarn test:ci

  build-tauri:
    needs: [create-release, lint-test]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: ubuntu-22.04
            arch: amd64
            rust_target: x86_64-unknown-linux-gnu
            tauri_args: ""
          - os: ubuntu-24.04-arm
            arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            tauri_args: "--target aarch64-unknown-linux-gnu"
          - os: macos-latest
            arch: universal
            rust_target: x86_64-apple-darwin,aarch64-apple-darwin
            tauri_args: "--target universal-apple-darwin"
          - os: windows-latest
            arch: amd64
            rust_target: x86_64-pc-windows-msvc
            tauri_args: ""
          - os: windows-11-arm
            arch: arm64
            rust_target: aarch64-pc-windows-msvc
            tauri_args: "--target aarch64-pc-windows-msvc"

    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.build_ref }}

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"

      - name: sync version from release tag
        run: node scripts/sync-version-from-tag.mjs "${{ needs.create-release.outputs.release_tag }}"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.config.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.config.os }}

      - name: install dependencies (ubuntu only)
        if: startsWith(matrix.config.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2

      - name: install frontend dependencies
        run: yarn install --frozen-lockfile && yarn export

      - name: configure cargo for network reliability
        if: startsWith(matrix.config.os, 'ubuntu-')
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << 'EOF'
          [http]
          http2 = false
          timeout = 60

          [net]
          retry = 5
          git-fetch-with-cli = true
          EOF

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || secrets.TAURI_KEY_PASSWORD }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ needs.create-release.outputs.release_tag }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.config.tauri_args }}

  build-electron:
    needs: [create-release, lint-test]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: ubuntu-22.04
            artifact_name: electron-linux-amd64
            command: yarn electron:build --linux AppImage deb
            artifact_glob: |
              release/*.AppImage
              release/*.deb
          - os: ubuntu-24.04-arm
            artifact_name: electron-linux-arm64
            command: yarn electron:build --linux AppImage deb
            artifact_glob: |
              release/*.AppImage
              release/*.deb
          - os: windows-latest
            artifact_name: electron-windows
            command: yarn electron:build --win nsis
            artifact_glob: release/*.exe
          - os: macos-latest
            artifact_name: electron-macos-universal
            command: yarn electron:build --mac dmg
            artifact_glob: release/*.dmg

    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.build_ref }}

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"

      - name: sync version from release tag
        run: node scripts/sync-version-from-tag.mjs "${{ needs.create-release.outputs.release_tag }}"

      - name: install Linux packaging dependencies (ubuntu only)
        if: startsWith(matrix.config.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: build electron app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ${{ matrix.config.command }}

      - name: upload electron artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.artifact_name }}
          path: ${{ matrix.config.artifact_glob }}
          if-no-files-found: error

      - name: upload electron to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.release_tag }}
          files: ${{ matrix.config.artifact_glob }}

  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [create-release, build-tauri, build-electron]

    steps:
      - name: publish release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.RELEASE_ID,
              draft: false,
              prerelease: false,
            })
