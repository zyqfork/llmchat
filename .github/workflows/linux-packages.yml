name: Build Linux AppImage / Flatpak

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build (manual trigger only)
        required: false
        default: main
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-appimage:
    name: Build AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref }}

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-appimage

      - name: install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: build AppImage
        run: |
          yarn install
          yarn export
          yarn tauri build --bundles appimage

      - name: upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: llmchat-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: upload AppImage to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/appimage/*.AppImage

  build-flatpak:
    name: Build Flatpak
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref }}

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-flatpak

      - name: install Linux / Flatpak dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libappindicator3-dev librsvg2-dev patchelf flatpak flatpak-builder

      - name: install Flatpak runtime
        run: |
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: build deb for flatpak staging
        run: |
          yarn install
          yarn export
          yarn tauri build --bundles deb

      - name: generate flatpak manifest from deb
        run: |
          python3 - <<'PY'
          import glob
          import os
          import shutil
          import subprocess
          from pathlib import Path

          deb_candidates = sorted(glob.glob("src-tauri/target/release/bundle/deb/*.deb"))
          if not deb_candidates:
            raise SystemExit("No deb package produced by tauri build.")

          deb_file = deb_candidates[0]
          staging_dir = Path("flatpak-staging")
          if staging_dir.exists():
            shutil.rmtree(staging_dir)
          staging_dir.mkdir(parents=True, exist_ok=True)

          subprocess.run(["dpkg-deb", "-x", deb_file, str(staging_dir)], check=True)

          bin_dir = staging_dir / "usr" / "bin"
          bins = sorted([p.name for p in bin_dir.iterdir() if p.is_file()])
          if not bins:
            raise SystemExit("No executable found in deb usr/bin.")
          command = bins[0]

          manifest = f"""app-id: com.github.zyqfork.llmchat
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
command: llmchat
finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  - --filesystem=home
modules:
  - name: llmchat
    buildsystem: simple
    sources:
      - type: dir
        path: flatpak-staging
    build-commands:
      - install -d /app
      - cp -a * /app/
      - install -d /app/bin
      - printf '#!/bin/sh\\nexec /app/usr/bin/{command} "$@"\\n' > /app/bin/llmchat
      - chmod +x /app/bin/llmchat
"""

          Path("flatpak-manifest.yml").write_text(manifest, encoding="utf-8")
          PY

      - name: build flatpak bundle
        run: |
          flatpak-builder --force-clean --repo=repo flatpak-build-dir flatpak-manifest.yml
          flatpak build-bundle repo llmchat-linux-x86_64.flatpak com.github.zyqfork.llmchat

      - name: upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: llmchat-flatpak
          path: llmchat-linux-x86_64.flatpak
          if-no-files-found: error

      - name: upload Flatpak to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: llmchat-linux-x86_64.flatpak
