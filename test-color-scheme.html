<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>配色方案测试</title>
  <style>
    /* 复制 color-schemes.scss 的内容进行测试 */
    
    /* Default 配色 */
    .light.color-scheme-default {
      --primary: #3b82f6;
      --primary-light: #60a5fa;
      --primary-dark: #2563eb;
    }
    
    .dark.color-scheme-default {
      --primary: #60a5fa;
      --primary-light: #93c5fd;
      --primary-dark: #3b82f6;
    }
    
    /* Ocean 配色 */
    .light.color-scheme-ocean {
      --primary: #0891b2;
      --primary-light: #06b6d4;
      --primary-dark: #0e7490;
    }
    
    .dark.color-scheme-ocean {
      --primary: #22d3ee;
      --primary-light: #67e8f9;
      --primary-dark: #06b6d4;
    }
    
    /* Forest 配色 */
    .light.color-scheme-forest {
      --primary: #059669;
      --primary-light: #10b981;
      --primary-dark: #047857;
    }
    
    .dark.color-scheme-forest {
      --primary: #34d399;
      --primary-light: #6ee7b7;
      --primary-dark: #10b981;
    }
    
    /* Sunset 配色 */
    .light.color-scheme-sunset {
      --primary: #f97316;
      --primary-light: #fb923c;
      --primary-dark: #ea580c;
    }
    
    .dark.color-scheme-sunset {
      --primary: #fb923c;
      --primary-light: #fdba74;
      --primary-dark: #f97316;
    }
    
    /* Purple 配色 */
    .light.color-scheme-purple {
      --primary: #9333ea;
      --primary-light: #a855f7;
      --primary-dark: #7e22ce;
    }
    
    .dark.color-scheme-purple {
      --primary: #a855f7;
      --primary-light: #c084fc;
      --primary-dark: #9333ea;
    }
    
    /* Rose 配色 */
    .light.color-scheme-rose {
      --primary: #e11d48;
      --primary-light: #f43f5e;
      --primary-dark: #be123c;
    }
    
    .dark.color-scheme-rose {
      --primary: #fb7185;
      --primary-light: #fda4af;
      --primary-dark: #f43f5e;
    }
    
    /* 基础样式 */
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    
    body.dark {
      background: #1a1a1a;
      color: #fff;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    
    .controls {
      margin-bottom: 30px;
      padding: 20px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    body.dark .controls {
      background: #2a2a2a;
    }
    
    .control-group {
      margin-bottom: 15px;
    }
    
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
    }
    
    select, button {
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    
    button {
      background: var(--primary, #3b82f6);
      color: white;
      border: none;
      cursor: pointer;
      margin-right: 10px;
    }
    
    button:hover {
      opacity: 0.9;
    }
    
    .color-display {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    
    .color-box {
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
    }
    
    .primary {
      background: var(--primary, #3b82f6);
      color: white;
    }
    
    .primary-light {
      background: var(--primary-light, #60a5fa);
      color: white;
    }
    
    .primary-dark {
      background: var(--primary-dark, #2563eb);
      color: white;
    }
    
    .info {
      margin-top: 20px;
      padding: 15px;
      background: #e3f2fd;
      border-radius: 4px;
      font-size: 14px;
    }
    
    body.dark .info {
      background: #1e3a5f;
    }
    
    code {
      background: rgba(0,0,0,0.1);
      padding: 2px 6px;
      border-radius: 3px;
      font-family: monospace;
    }
  </style>
</head>
<body class="light color-scheme-default">
  <div class="container">
    <h1>配色方案测试页面</h1>
    
    <div class="controls">
      <div class="control-group">
        <label for="theme">主题模式:</label>
        <select id="theme" onchange="changeTheme()">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
      
      <div class="control-group">
        <label for="colorScheme">配色方案:</label>
        <select id="colorScheme" onchange="changeColorScheme()">
          <option value="default">Default (默认蓝调)</option>
          <option value="ocean">Ocean (海洋蓝绿)</option>
          <option value="forest">Forest (森林绿)</option>
          <option value="sunset">Sunset (日落橙红)</option>
          <option value="purple">Purple (紫色梦幻)</option>
          <option value="rose">Rose (玫瑰粉)</option>
        </select>
      </div>
      
      <button onclick="showCurrentValues()">显示当前CSS变量值</button>
    </div>
    
    <div class="color-display">
      <div class="color-box primary">
        Primary<br>
        <small id="primary-value"></small>
      </div>
      <div class="color-box primary-light">
        Primary Light<br>
        <small id="primary-light-value"></small>
      </div>
      <div class="color-box primary-dark">
        Primary Dark<br>
        <small id="primary-dark-value"></small>
      </div>
    </div>
    
    <div class="info">
      <strong>当前状态:</strong><br>
      Body Classes: <code id="body-classes"></code><br>
      <div id="css-values" style="margin-top: 10px;"></div>
    </div>
  </div>
  
  <script>
    function changeTheme() {
      const theme = document.getElementById('theme').value;
      document.body.classList.remove('light', 'dark');
      document.body.classList.add(theme);
      updateDisplay();
    }
    
    function changeColorScheme() {
      const scheme = document.getElementById('colorScheme').value;
      // 移除所有配色类
      document.body.classList.remove(
        'color-scheme-default',
        'color-scheme-ocean',
        'color-scheme-forest',
        'color-scheme-sunset',
        'color-scheme-purple',
        'color-scheme-rose'
      );
      // 添加新的配色类
      document.body.classList.add(`color-scheme-${scheme}`);
      updateDisplay();
    }
    
    function updateDisplay() {
      const styles = getComputedStyle(document.body);
      const primary = styles.getPropertyValue('--primary').trim();
      const primaryLight = styles.getPropertyValue('--primary-light').trim();
      const primaryDark = styles.getPropertyValue('--primary-dark').trim();
      
      document.getElementById('primary-value').textContent = primary;
      document.getElementById('primary-light-value').textContent = primaryLight;
      document.getElementById('primary-dark-value').textContent = primaryDark;
      document.getElementById('body-classes').textContent = document.body.className;
      
      document.getElementById('css-values').innerHTML = `
        --primary: <code>${primary}</code><br>
        --primary-light: <code>${primaryLight}</code><br>
        --primary-dark: <code>${primaryDark}</code>
      `;
    }
    
    function showCurrentValues() {
      updateDisplay();
      alert('CSS变量值已更新在页面下方');
    }
    
    // 初始化显示
    updateDisplay();
  </script>
</body>
</html>
